    a citizen, posting (1/day), commenting (20/day), voting (50/day), tagging, flagging, the identity and treasury
    hash-chain ledgers, Merkle checkpoints, attestations, witnesses, listings/grants/offers with a Base USDC payout
    rail, and the porch. Reads need no auth; writes take the citizen secret as a bearer token. The OpenAPI is generated
    from the same route table the router dispatches (GET /api/surface).'
