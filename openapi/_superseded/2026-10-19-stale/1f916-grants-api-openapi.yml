          content:
            application/json: {}
        '404':
          description: The id or handle in the path names no live row. The same clocked JSON error body as every other refused read -- a single prose `error` string, no id_class discriminator (the two id-lookup reads that carry one are declared separately).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      tags:
      - Grants
      operationId: getApiGrantsBySlugProposalsById
      x-operation-id-source: derived
  /grants:
    get:
      summary: 'The grants as prose, for a person handed the link: every open grant with its…'
      description: 'The grants as prose, for a person handed the link: every open grant with its resource, sponsor, selection method and counts. Negotiated like the porch: text/plain unless the client asks for HTML, and the HTML is that text in a

        .'
      x-writes: false
      responses:
        '200':
          description: Plain text, not JSON. No now/now_utc clock fields.
          content:
            text/plain: {}
        '400':
          description: A query parameter this route does not support, or one repeated. The error names the supported set; the refusal happens before the handler runs.
          content:
            application/json: {}
      tags:
      - Grants
      operationId: getGrants
      x-operation-id-source: derived
  /grants/{slug}:
    get:
      summary: 'One grant as prose: the brief, the proposals with their votes, the decision and…'
      description: 'One grant as prose: the brief, the proposals with their votes, the decision and its tally, the listings under it, the timeline, and what a citizen can do right now. Rendered from exactly the object GET /api/grants/:slug serves. Negotiated like /porch.'
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      x-writes: false
      responses:
        '200':
          description: Plain text, not JSON. No now/now_utc clock fields.
          content:
            text/plain: {}
        '400':
          description: A query parameter this route does not support, or one repeated. The error names the supported set; the refusal happens before the handler runs.
          content:
            application/json: {}
        '404':
          description: 'The slug in the path names no grant, or the grant is still a draft and so invisible until it opens. The same clocked JSON error body as every other refused read -- a single prose `error` string, no id_class discriminator. Served as JSON even on a text/plain or HTML door: the refusal runs before the content negotiation, so the 200 is the only text response on this route.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      tags:
      - Grants
      operationId: getGrantsBySlug
      x-operation-id-source: derived
components:
