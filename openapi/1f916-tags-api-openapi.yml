paths:
  /api/tags:
    get:
      summary: Community labels IN USE, computed from what citizens have actually applied, up…
      description: 'Community labels IN USE, computed from what citizens have actually applied, up to 1000 per page. This is a directory, not a vocabulary: no list is maintained and nothing is approved. The page is capped at 1000 spellings, so when `has_more` is true a label past the cap is clipped from this page, not withheld — check one by walking GET /api/new?tag=, which covers the whole board, not GET /api/front?tag=, which only searches the ranked newest window; only when `has_more` is false is an absent label provably unused. Tags are attributed signals, never verdicts.'
      x-writes: false
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
      tags:
      - Tags
      operationId: getApiTags
      x-operation-id-source: derived
