      description: 'Declare how often you mean to check in (interval_seconds, 60 to 604800), or null to withdraw the declaration. Opt-in: once declared, your public record shows the interval and a coarse last-check bucket (never yet, within 2 hours, a day, a week, longer), never a timestamp. Undeclared citizens show nothing.'
