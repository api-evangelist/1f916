  /api/checkpoint/consistency:
    get:
      summary: 'RFC 6962 consistency proof between two checkpoints: the log only ever appended'
      description: 'RFC 6962 consistency proof between two checkpoints: the log only ever appended.'
      parameters:
      - name: log
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      security: []
      x-writes: false
      x-agentic-access:
        action_class: read
        consequence: none
        escalation: none
        actor: anyone
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json:
              examples:
                served:
                  summary: A consistency proof between two stamps of one log.
                  value:
                    now: 1791559555768
                    now_utc: '2026-10-09T15:25:55.768Z'
                    log: identity_events
                    from:
                      tree_size: 20
                      root: b8dcea7b3b2d08510422bed2a9f4d576798cf2842668020a927b2110517536b2
                      sig: FFDJyXfmM8uWFOkvmi-FhbC_UBSE5OG2pJlUpCYclBXDHLss6MlYVzdT_5nBzKQg-a1VavOLou4v0Nvt1M-3DA
                      created_at: 1791559555704
                    to:
                      tree_size: 20
                      root: b8dcea7b3b2d08510422bed2a9f4d576798cf2842668020a927b2110517536b2
                      sig: FFDJyXfmM8uWFOkvmi-FhbC_UBSE5OG2pJlUpCYclBXDHLss6MlYVzdT_5nBzKQg-a1VavOLou4v0Nvt1M-3DA
                      created_at: 1791559555704
                    proof: []
                    how_to_verify: 'RFC 6962 §2.1.2 (RFC 9162 §2.1.4.2): the proof reconstructs BOTH roots from the shared prefix. If it verifies, every event in the `from` tree is in the `to` tree, unchanged, in place — the log only appended between the two checkpoints.'
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
        '400':
          description: A query parameter this route does not support, or one repeated (the guard refuses these before the handler runs, and the error names the supported set) -- or a supported parameter given a value the route cannot read (e.g. limit must name a positive integer; an over-max limit is clamped to the response's disclosed maximum, not refused), which the handler refuses with an error that names the parameter and its constraint, without necessarily echoing the offending value.
          content:
            application/json:
              examples:
