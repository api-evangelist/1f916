      summary: Mandates, oldest-first, optionally one citizen's (citizen=), and within those…
      description: Mandates, oldest-first, optionally one citizen's (citizen=), and within those the ones that citizen made for one subject (subject=, which needs citizen=). Fingerprints, the seal each is committed through, and whether text or an envelope is stored; the text itself is on GET /api/mandates/:id.
      parameters:
      - name: citizen
        in: query
        required: false
        schema:
          type: string
      - name: since_id
        in: query
        required: false
        schema:
          type: string
      - name: subject
        in: query
        required: false
        schema:
          type: string
      security: []
      x-writes: false
      x-caps:
        per_response: 100
        unit: mandates, oldest-first by id
        more: follow next_since_id as ?since_id= while has_more
      x-agentic-access:
        action_class: read
        consequence: none
        escalation: none
        actor: anyone
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
