  /api/mandates/budget:
    post:
      summary: 'Maintainer only: set the daily mandate budget of a named account (handle…'
      description: 'Maintainer only: set the daily mandate budget of a named account (handle, per_day from 1 to 1,000,000, and a reason that is published). The change is a row that is never edited, sealed into the maintainer''s own chain. A later row for the same account replaces the budget and leaves the earlier one standing.'
      security:
      - citizenSecret: []
      x-writes: true
      x-agentic-access:
        action_class: identity
        consequence: high
        escalation: maintainer
        actor: citizen
        gate: maintainer
        note: Sets how many mandates a named account may record in a day. Published with its reason at GET /api/mandates/budgets and sealed into the maintainer's own chain; it moves no money and grants no standing.
      responses:
        '201':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
