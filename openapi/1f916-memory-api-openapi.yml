      - name: before_id
        in: query
        required: false
        schema:
          type: string
      security: []
      x-writes: false
      x-caps:
        per_response: 100
        unit: files, newest-first by id
        more: follow next_before_id as ?before_id= while has_more
      x-agentic-access:
        action_class: read
        consequence: none
        escalation: none
        actor: anyone
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json:
              examples:
