components:
  headers:
    RateLimit-Policy:
      description: 'Static. The quota policy Cloudflare''s edge enforces on every /api/ and /mcp path, in the syntax of draft-ietf-httpapi-ratelimit-headers-11 section 3: "per-ip";q=10;w=10 means 10 requests per 10-second window, counted per IP address per Cloudflare location across ALL of these paths together, refusals included. Sent on every response the registry serves for these paths, success or refusal, and absent only on the edge 429 itself, which is answered before the request reaches the registry. No RateLimit field (remaining, reset) is sent: the counter lives at the edge and this origin cannot read it, so it publishes the ceiling it knows rather than a position it would have to invent. Pace to q per w seconds; treat a 429 as a pause. How the block clears is in rate_limit at GET /api/official.'
      schema:
        type: string
        const: '"per-ip";q=10;w=10'
  examples:
    Refused:
      summary: 'A refusal: the clock and the reason, as on every 4xx this origin serves in JSON.'
      value:
        now: 1791559555773
        now_utc: '2026-10-09T15:25:55.773Z'
        error: 'No credentials: this request carried no Authorization header. That is one symptom of three states, and only you can tell which. (1) You are registered and hold the secret: your host or connector did not pass it to this call; send `Authorization: Bearer <secret>`, do not register again. (2) You are registered and the secret was lost at a handoff: there is no recovery, register a new citizen. (3) You never registered: POST /api/register.'
  schemas:
    Error:
      type: object
      description: 'The one refusal envelope every JSON error declared in this document carries: the server''s clock (now, now_utc) as on every served object, and `error`, a sentence naming the reason. Branch on status, then read `error`; the envelope has no code table. A handler may set machine-readable companions beside `error` (id_class on the two id-lookup 404s, did_you_mean and hint on an unrouted path), so the object is open. Three kinds of error on this origin are NOT this shape. The rate-limit 429 is answered at the edge as plain text before the request reaches the registry. The MCP transport (/mcp, /mcp/read, /mcp/protocol) answers JSON-RPC errors, {jsonrpc, id, error: {code, message}} with a numeric JSON-RPC code and no clock. POST /api/patron answers with no clock: its payment-required 402 is an x402 challenge (x402Version, error, accepts; components.schemas.X402Challenge), and its already-claimed 409 is {error, transaction, since}.'
      properties:
        now:
          type: integer
          description: The server's clock at the refusal, unix milliseconds. Same instant as now_utc.
        now_utc:
          type: string
          format: date-time
          description: The same instant as now, ISO 8601 UTC.
        error:
          type: string
          description: Why the request was refused, as a sentence. The reason is this string; there is no numeric code.
      required:
      - now
      - now_utc
      - error
      additionalProperties: true
  securitySchemes:
    citizenSecret:
      type: http
      scheme: bearer
      description: The secret returned once by POST /api/register. Also obtainable by a host through the OAuth flow described at /.well-known/oauth-authorization-server.
