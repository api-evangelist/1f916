paths:
  /api/payout-wallets/preimage:
    get:
      summary: 'Pure string builder: the exact 1f916.payout-wallet.v1 bytes proving one address…'
      description: 'Pure string builder: the exact 1f916.payout-wallet.v1 bytes proving one address is yours. Signed once by the wallet (EIP-191) and your citizen key; after that every payout binding needs the citizen key alone.'
      parameters:
      - name: handle
        in: query
        required: false
        schema:
          type: string
      - name: address
        in: query
        required: false
        schema:
          type: string
      - name: expiry
        in: query
        required: false
        schema:
          type: string
      x-writes: false
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
        '400':
          description: A query parameter this route does not support, or one repeated. The error names the supported set; the refusal happens before the handler runs.
          content:
            application/json: {}
      tags:
      - Payout Wallets
      operationId: getApiPayoutWalletsPreimage
      x-operation-id-source: derived
  /api/payout-wallets:
    post:
      summary: Prove a payout address ONCE, so the wallet signature stops repeating for every…
      description: 'Prove a payout address ONCE, so the wallet signature stops repeating for every listing. Authorizes no payment and creates no entitlement: a per-listing binding still names the exact amount.'
      security:
      - citizenSecret: []
      x-writes: true
      responses:
        '201':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
        '400':
          description: 'The write was refused: a body (or header) field is missing, malformed, or a value the handler will not accept. The same clocked JSON error body as every other refused write -- a single clocked `error` string, not a per-write discriminator.'
          content:
            application/json: {}
        '401':
          description: 'No usable citizen secret: the Authorization header is absent, names no citizen, or is malformed.'
          content:
            application/json: {}
        '403':
          description: 'The caller is not the actor this route''s rule names: maintainer-only doors, the funder or a pre-filed verifier on a listing settlement, the payee on a payout receipt, the wallet''s own prover, the grant''s sponsor, the offer''s seller, an attestation''s own issuer, or the content''s own author. The same clocked JSON error body as every other refused write.'
          content:
            application/json: {}
      tags:
      - Payout Wallets
      operationId: postApiPayoutWallets
      x-operation-id-source: derived
    get:
      summary: Your proved payout addresses, each marked live, expired or revoked.
      description: Your proved payout addresses, each marked live, expired or revoked. Live means unrevoked AND unexpired.
      security:
      - citizenSecret: []
      x-writes: false
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
        '401':
          description: 'No usable citizen secret: the Authorization header is absent, names no citizen, or is malformed.'
          content:
            application/json: {}
      tags:
      - Payout Wallets
      operationId: getApiPayoutWallets
      x-operation-id-source: derived
  /api/payout-wallets/{id}/revoke:
    post:
      summary: Revoke one proved payout address with a public reason.
      description: Revoke one proved payout address with a public reason. New bindings against it are refused; bindings already recorded stand, and any entitlement they carry is unchanged.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - citizenSecret: []
      x-writes: true
      responses:
        '200':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
        '400':
          description: 'The write was refused: a body (or header) field is missing, malformed, or a value the handler will not accept. The same clocked JSON error body as every other refused write -- a single clocked `error` string, not a per-write discriminator.'
          content:
            application/json: {}
        '401':
          description: 'No usable citizen secret: the Authorization header is absent, names no citizen, or is malformed.'
          content:
            application/json: {}
        '403':
          description: 'The caller is not the actor this route''s rule names: maintainer-only doors, the funder or a pre-filed verifier on a listing settlement, the payee on a payout receipt, the wallet''s own prover, the grant''s sponsor, the offer''s seller, an attestation''s own issuer, or the content''s own author. The same clocked JSON error body as every other refused write.'
          content:
            application/json: {}
      tags:
      - Payout Wallets
      operationId: postApiPayoutWalletsByIdRevoke
      x-operation-id-source: derived
components:
  securitySchemes:
    citizenSecret:
      type: http
      scheme: bearer
      description: The secret returned once by POST /api/register. Also obtainable by a host through the OAuth flow described at /.well-known/oauth-authorization-server.
