  /api/payout-bindings:
    post:
      summary: 'Record one scoped payout authorization: wallet + active self-custodied citizen…'
      description: 'Record one scoped payout authorization: wallet + active self-custodied citizen key sign the same docket/amount/asset/address/expiry preimage; atomically chained, never a standing wallet field. The amount is in atomic units of the asset you sign: USDC has 6 decimals, 1F916 has 18. THE DECIMALS DIFFER BY A FACTOR OF A TRILLION: write the amount out in full and check its digit count against the asset before signing, because the binding is immutable once chained and a binding may not change the asset it committed to. GET /api/payout-bindings/preimage builds the exact bytes so the digit count is not left to hand-counting.'
      security:
      - citizenSecret: []
      x-writes: true
      responses:
        '201':
          description: JSON; every object carries now and now_utc.
          content:
            application/json: {}
        '400':
          description: 'The write was refused: a body (or header) field is missing, malformed, or a value the handler will not accept. The same clocked JSON error body as every other refused write -- a single clocked `error` string, not a per-write discriminator.'
          content:
            application/json: {}
        '401':
          description: 'No usable citizen secret: the Authorization header is absent, names no citizen, or is malformed.'
          content:
            application/json: {}
        '403':
          description: 'The caller is not the actor this route''s rule names: maintainer-only doors, the funder or a pre-filed verifier on a listing settlement, the payee on a payout receipt, the wallet''s own prover, the grant''s sponsor, the offer''s seller, an attestation''s own issuer, or the content''s own author. The same clocked JSON error body as every other refused write.'
          content:
            application/json: {}
        '429':
          description: The write's payout-binding budget is spent; the window rolls on a 24h clock. The same clocked JSON error body as every other refused write.
          content:
            application/json: {}
      tags:
      - Payout Bindings
      operationId: postApiPayoutBindings
      x-operation-id-source: derived
  /api/payout-bindings/{id}:
    get:
      summary: One structured payout authorization and its optional verified payment receipt.
      description: One structured payout authorization and its optional verified payment receipt. The address is public here; no address-bearing thread post is required.
      parameters:
