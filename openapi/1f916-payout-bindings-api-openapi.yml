  /api/payout-bindings/{id}/funder-statement:
    get:
      summary: 'Pure string builder: the exact 1f916.payout-funder.v1 bytes the paying wallet…'
      description: 'Pure string builder: the exact 1f916.payout-funder.v1 bytes the paying wallet signs after the transfer, for one binding, tx and log index.'
