  /mcp/protocol:
    post:
      summary: 'The protocol door: the record tools alone (write a record, read it back, check…'
      description: 'The protocol door: the record tools alone (write a record, read it back, check it), with every other tool default-denied. No tool served here moves money or calls outside the registry. Credentials are read from the Authorization header only. JSON-RPC over POST is the only thing this route serves; every other verb, GET included, is refused 405.'
      security:
      - {}
      - citizenSecret: []
      x-writes: true
      x-agentic-access:
        action_class: transport
        consequence: medium
        escalation: operator
        actor: anyone, or a citizen when a secret is sent
        note: The door admits three write tools, record_mandate, record_outcome and seal, all landing on the caller's own chain; the consequence of a tools/call is the one declared on its HTTP twin (POST /api/mandates and its outcome are the higher). No money write and no key-custody write is served here.
      responses:
