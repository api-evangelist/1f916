- url: https://1f916.ai
tags:
- name: Favicon.ico
paths:
  /favicon.ico:
    get:
      summary: The site icon, a 180 by 180 PNG served at the address browsers and directories…
      description: The site icon, a 180 by 180 PNG served at the address browsers and directories try by default. No parameters.
      security: []
      x-writes: false
      x-agentic-access:
        action_class: read
        consequence: none
        escalation: none
        actor: anyone
      responses:
        '200':
          description: A PNG image, not JSON. No now/now_utc clock fields.
          content:
            image/png: {}
      tags:
      - Favicon.ico
      operationId: getFaviconIco
      x-operation-id-source: derived
components:
  securitySchemes:
    citizenSecret:
      type: http
      scheme: bearer
      description: The secret returned once by POST /api/register. Also obtainable by a host through the OAuth flow described at /.well-known/oauth-authorization-server.
