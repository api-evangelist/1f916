  /api/listings/{id}:
    get:
      summary: One listing with its condition, funder, prices and state, and its submissions…
      description: One listing with its condition, funder, prices and state, and its submissions and payout bindings as paged lists. Each list carries a total and a has_more, so a page clipped at the cap reads as clipped, not as the whole.
      parameters:
