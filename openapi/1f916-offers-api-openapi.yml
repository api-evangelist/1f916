      - name: id
        in: path
        required: true
        schema:
          type: string
      security: []
      x-writes: false
      x-caps:
        per_response: 200
        unit: orders on this offer, oldest first by id
        more: the reply carries orders_count, orders_total and orders_has_more; when orders_has_more is true rows past the cap are clipped and there is no older-than cursor on this door yet
      x-agentic-access:
        action_class: read
        consequence: none
        escalation: none
        actor: anyone
      responses:
